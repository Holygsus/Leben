<section class="view-header">
  <div class="view-title-group">
    <div class="view-icon-badge"><svg viewBox="0 0 24 24"><path d="M3 5h18v12H3z"/><path d="M8 21h8M12 17v4M8 2l3 3M16 2l-3 3"/></svg></div>
    <h1>Fernsehprogramm</h1>
  </div>
  <div class="view-header-actions">
    <button type="button" class="icon-btn" id="watchlist-quick-add-toggle" aria-label="Watchlist-Eintrag hinzufügen"><span class="inline-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></button>
  </div>
</section>

<form class="quick-capture-panel" id="watchlist-quick-form" hidden>
  <input type="text" class="input" id="watchlist-quick-title" placeholder="Titel (Serie, Anime, Film)" autocomplete="off" required />
  <select class="select" id="watchlist-quick-type" aria-label="Typ">
    <option value="serie">Serie</option>
    <option value="anime">Anime</option>
    <option value="film">Film</option>
    <option value="doku">Doku</option>
    <option value="youtube">YouTube</option>
  </select>
  <div class="quick-capture-actions">
    <button class="btn" type="submit">Hinzufügen</button>
    <button class="btn btn-secondary" type="button" id="watchlist-quick-cancel">Abbrechen</button>
  </div>
</form>

<section class="tv-program" aria-label="Programm">
  <div class="tv-week" id="tv-week" role="tablist" aria-label="Tag wählen"></div>
  <div class="tv-prog" id="tv-prog"></div>
  <div class="empty-state-rich" id="tv-empty-state" hidden>
    <svg viewBox="0 0 24 24"><path d="M3 5h18v12H3z"/><path d="M8 21h8M12 17v4M8 2l3 3M16 2l-3 3"/></svg>
    <strong id="tv-empty-title">Sendepause</strong>
    <span id="tv-empty-text">Für diesen Tag ist nichts eingeplant.</span>
    <button class="btn" type="button" id="tv-build" hidden>Programm erstellen</button>
  </div>
</section>

<section class="tv-upcoming" id="tv-upcoming" hidden>
  <div class="tv-label">Demnächst</div>
  <div class="tv-strip" id="tv-upcoming-strip"></div>
</section>

<button type="button" class="tv-learn" id="tv-learn" aria-expanded="false" aria-controls="tv-learn-bars">
  <span class="tv-learn-head"><span>Dein Sender lernt</span><span class="tv-learn-sum" id="tv-learn-sum"></span></span>
  <span class="tv-learn-bars" id="tv-learn-bars" hidden></span>
</button>
<button type="button" class="tv-rebuild" id="tv-rebuild">↻ Programm neu mischen</button>

<section class="panel">
  <div class="panel-header">
    <h2>Watchlist</h2>
    <button type="button" class="icon-btn" id="watchlist-toggle" aria-label="Watchlist anzeigen"><span class="inline-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span></button>
  </div>
  <div id="watchlist-panel" hidden>
    <div class="filter-toggle-row">
      <button type="button" class="filter-toggle-btn" id="watchlist-filter-toggle" aria-expanded="false" aria-controls="watchlist-filter-bar">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        Filtern <span class="filter-count" id="watchlist-filter-count" hidden></span>
      </button>
    </div>
    <section class="filter-bar watchlist-filter-bar" id="watchlist-filter-bar" hidden>
      <input type="search" class="input" id="watchlist-filter-title" placeholder="Titel suchen…" autocomplete="off" aria-label="Nach Titel suchen" />
      <div class="watchlist-filter-chips" id="watchlist-filter-type" role="group" aria-label="Nach Typ filtern">
        <button type="button" class="pot-chip" data-type="serie">Serie</button>
        <button type="button" class="pot-chip" data-type="anime">Anime</button>
        <button type="button" class="pot-chip" data-type="film">Film</button>
        <button type="button" class="pot-chip" data-type="doku">Doku</button>
        <button type="button" class="pot-chip" data-type="youtube">YouTube</button>
      </div>
      <div class="watchlist-filter-chips" id="watchlist-filter-rating" role="group" aria-label="Nach Bewertung filtern">
        <button type="button" class="pot-chip" data-rating="7">Ø ≥ 7</button>
        <button type="button" class="pot-chip" data-rating="8">Ø ≥ 8</button>
        <button type="button" class="pot-chip" data-rating="9">Ø ≥ 9</button>
      </div>
      <input type="text" class="input" id="watchlist-filter-genre" placeholder="Genre" autocomplete="off" />
    </section>
    <div id="watchlist-overview"></div>
    <div class="empty-state-rich" id="watchlist-overview-empty-state" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <strong>Watchlist ist leer</strong>
      <span>Leg oben über "+" deinen ersten Eintrag an.</span>
    </div>
  </div>
</section>
